[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkea-extract"
version = "0.1.0"
description = "MKEA extraction agent: PDF -> mesoporous materials records"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MKEA team" }]
dependencies = [
    "pymupdf>=1.26,<2",
]

[project.optional-dependencies]
# Web layer (webapp/). The extraction core itself does not need these.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
mkea-extract = "mkea_extract.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
